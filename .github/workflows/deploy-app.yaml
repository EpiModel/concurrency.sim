name: Deploy Shinylive App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("shinylive", "shiny"))
        shell: Rscript {0}

      - name: Export shinylive app
        # Pinned on purpose. Assets 0.10.5 and later (webR with R 4.5/4.6) overflow
        # Safari's call stack inside renderPlot, so the plot never renders there.
        # 0.10.4 (R 4.4.1, shiny 1.9.1) is the newest release that works in Safari.
        run: |
          shinylive::export(".", "site", assets_version = "0.10.4")
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
